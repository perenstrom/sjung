name: PR title

# PRs are squash-merged and the PR title becomes the commit message on main,
# which release-please reads to pick the next version and write the changelog.
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  # Branch protection on main requires a check with exactly this name.
  pr-title:
    name: PR title
    runs-on: ubuntu-latest

    steps:
      # Types and casing follow the "Commits" section in README.md.
      - name: Require a Conventional Commit title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" in the PR title "{title}" starts with an upper-case letter. Start it lower case, e.g. "fix(auth): correct token refresh".
