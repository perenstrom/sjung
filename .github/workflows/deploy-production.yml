name: Deploy to production

on:
  # Manual deploys and rollbacks.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit on main to deploy, e.g. to roll back. Empty deploys main's current HEAD."
        type: string
        required: false
        default: ""
      force:
        description: "Force a clean --no-cache rebuild instead of reusing an existing image for this commit"
        type: boolean
        default: false
  # The release workflow, after merging a release PR.
  workflow_call:
    inputs:
      sha:
        description: "Release commit to deploy"
        type: string
        required: true
      force:
        description: "Force a clean --no-cache rebuild"
        type: boolean
        default: false

permissions:
  contents: read
  checks: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 90
    # Never run two production deploys at once, and never cancel one
    # mid-flight. Set on the job so it also holds when the release workflow
    # calls this one.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::This workflow can only be run against main (got $REF)."
            exit 1
          fi

      # A rollback names an older commit, which must already be on main.
      - name: Resolve the commit to deploy
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REQUESTED_SHA: ${{ inputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          requested="${REQUESTED_SHA:-$HEAD_SHA}"
          if ! sha=$(gh api "repos/$REPO/commits/$requested" --jq .sha); then
            echo "::error::Commit '$requested' doesn't exist in $REPO."
            exit 1
          fi
          # "identical" or "ahead" means main contains the commit.
          status=$(gh api "repos/$REPO/compare/$sha...refs/heads/main" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "ahead" ]; then
            echo "::error::Commit $sha isn't on main (compare status: $status)."
            exit 1
          fi
          echo "Deploying $sha."
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Must match the job names CI reports, which are also the required
      # status checks on main. After a release PR merges, CI on the release
      # commit is still running, so a release deploy waits for it to finish.
      # A manual deploy or rollback doesn't wait: an old commit with no check
      # runs would otherwise spin until the timeout.
      - name: Require CI to pass on the commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            max_polls=1
          else
            # 45 minutes: CI starts on the same push and runs e2e last.
            max_polls=90
          fi
          poll_interval=30
          for i in $(seq 1 "$max_polls"); do
            pending=""
            for job in "build" "Integration Tests" "e2e"; do
              result=$(gh api --method GET "repos/$REPO/commits/$SHA/check-runs" -f check_name="$job" \
                --jq '.check_runs | sort_by(.started_at) | last | "\(.status) \(.conclusion)"') || result="unreachable"
              case "$result" in
                "completed success")
                  ;;
                completed\ *)
                  echo "::error::CI job '$job' failed on $SHA (${result#completed })."
                  exit 1
                  ;;
                *)
                  pending="$pending '$job' ($result)"
                  ;;
              esac
            done
            if [ -z "$pending" ]; then
              echo "CI jobs build, Integration Tests and e2e are green on $SHA."
              exit 0
            fi
            echo "[$i/$max_polls] not green yet:$pending"
            if [ "$i" -lt "$max_polls" ]; then
              sleep "$poll_interval"
            fi
          done
          echo "::error::CI isn't green on $SHA:$pending"
          exit 1

      # Coolify's production app tracks the production branch and builds
      # whatever it points to when Coolify fetches. Pointing it at the checked
      # commit first means a merge to main during this run can't reach
      # production. Only the release app may push to production, and the ref
      # update is forced so a rollback can move the branch backwards.
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Move the production branch to the commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          gh api --method PATCH "repos/$REPO/git/refs/heads/production" -f sha="$SHA" -F force=true --jq .object.sha

      - name: Trigger Coolify production deploy
        id: trigger
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_PROD_APP_UUID: ${{ vars.COOLIFY_PROD_APP_UUID }}
          COOLIFY_PROD_TOKEN: ${{ secrets.COOLIFY_PROD_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          http_code=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
            --request POST "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_PROD_APP_UUID}&force=${FORCE}" \
            --header "Authorization: Bearer ${COOLIFY_PROD_TOKEN}")
          cat response.json
          if [ "$http_code" -ge 300 ]; then
            echo "::error::Coolify deploy-trigger request failed (HTTP $http_code)."
            exit 1
          fi
          deployment_uuid=$(jq -r '.deployments[0].deployment_uuid' response.json)
          if [ -z "$deployment_uuid" ] || [ "$deployment_uuid" = "null" ]; then
            echo "::error::Coolify's response didn't include a deployment_uuid."
            exit 1
          fi
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for the deployment to finish
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_PROD_TOKEN: ${{ secrets.COOLIFY_PROD_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          # 20 minutes: a forced no-cache build is the slow case.
          max_polls=120
          poll_interval=10
          for i in $(seq 1 "$max_polls"); do
            # A transient API error shouldn't fail the job while Coolify keeps deploying.
            status=$(curl --fail --silent --request GET \
              "${COOLIFY_URL}/api/v1/deployments/${DEPLOYMENT_UUID}" \
              --header "Authorization: Bearer ${COOLIFY_PROD_TOKEN}" | jq -r '.status') || status="unreachable"
            echo "[$i/$max_polls] deployment $DEPLOYMENT_UUID status: $status"
            case "$status" in
              finished)
                exit 0
                ;;
              failed|"cancelled-by-user")
                echo "::error::Coolify deployment ended with status '$status'."
                exit 1
                ;;
            esac
            sleep "$poll_interval"
          done
          echo "::error::Timed out waiting for the deployment to finish."
          exit 1

      # Coolify resolves the production branch to a commit when it fetches
      # and records it on the deployment.
      - name: Confirm Coolify deployed the commit
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_PROD_TOKEN: ${{ secrets.COOLIFY_PROD_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          deployed=$(curl --fail --silent --show-error --request GET \
            "${COOLIFY_URL}/api/v1/deployments/${DEPLOYMENT_UUID}" \
            --header "Authorization: Bearer ${COOLIFY_PROD_TOKEN}" | jq -r '.commit')
          if [ "$deployed" != "$SHA" ]; then
            echo "::error::Coolify deployed ${deployed:-an unknown commit}, not $SHA."
            exit 1
          fi
          echo "Coolify deployed $SHA."
